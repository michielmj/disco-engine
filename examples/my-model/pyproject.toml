[project]
name = "my-model"
description = "A Disco simulation model."
version = "0.0.1"
dependencies = [
    "numpy~=2.5",
    "pandas~=3.1",
    "python-graphblas~=2026.11",
    "disco-toolbox>=0.1.0",
    "scipy>=1.17",
    "disco-tools>=0.2.0",
]

[build-system]
requires = [
    "setuptools>=69",
    "setuptools-scm>=8"
]
build-backend = "setuptools.build_meta"

[project.entry-points."disco.models"]
my-model = "my_model_pkg.plugin:model_package"
