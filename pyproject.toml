# pyproject.toml
[project]
name = "disco-engine"
dynamic = ["version"]
description = "A distributed event simulation core (disco) engine."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "Michiel Jansen" }]
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: C++",
  "Operating System :: OS Independent",
]
dependencies = [
  "numpy~=2.5",
  "pandas~=3.1",
  "pydantic~=2.12",
  "pydantic-settings~=2.12",
  "kazoo~=2.10",
  "python-graphblas~=2026.11",
  "graphblas-algorithms~=2023.10",
  "SQLAlchemy~=2.0",
  "disco-tools>=0.2.0",
  "disco-data-logger>=0.2.0",
  "grpcio>=1.60",
  "protobuf>=4.25",
  "PyYAML>=6.0",
  "scipy>=1.13",
  "scikit-learn>=1.5",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "mypy>=1.10",
  "cibuildwheel>=3.3",
  "pybind11-stubgen>=2.5",
  "twine>=5",
  "grpcio-tools>=1.60",
  "psycopg[binary]>=3.3",
  "types-PyYAML>=6.0",
  "pytest-timeout>=2.3",
  "ruff~=0.17",
  "import-linter~=2.15",
  "clang-format~=23.1",
]

[build-system]
requires = [
  "scikit-build-core>=0.11.6",
  "pybind11>=2.11",
  "numpy>=2.0",
  "setuptools-scm>=8",
  "Cython>=3.2"
]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
editable.mode = "redirect"
build-dir = "build/{wheel_tag}"
wheel.packages = ["src/disco"]

[tool.uv]
# uv rebuilds the native core only when one of these changes. A native source
# that is not listed here is not rebuilt, and the tests then run against a
# stale build without saying so.
cache-keys = [
  { file = "pyproject.toml" },
  { file = "CMakeLists.txt" },
  { file = "cmake/**" },
  { file = "src/**/CMakeLists.txt" },
  { file = "src/**/*.cpp" },
  { file = "src/**/*.hpp" },
  { file = "src/**/*.h" },
  { file = "src/**/*.pyx" },
  { file = "src/**/*.pxd" },
  { git = { commit = true, tags = true } },
]

[tool.scikit-build.cmake.define]
CMAKE_DOWNLOAD_TIMEOUT = 30
PYBIND11_FINDPYTHON = true

[tool.scikit-build.metadata]
version.provider = "scikit_build_core.metadata.setuptools_scm"

[tool.setuptools_scm]
write_to = "src/disco/_version.py"
version_scheme = "guess-next-dev"
local_scheme = "no-local-version"
fallback_version = "0.0.0"

[tool.cibuildwheel]
build = "cp314-* cp315-*"
skip = "*-musllinux_*"
test-command = "pytest -q {project}/tests"
test-groups = ["dev"]

[tool.cibuildwheel.linux]
archs = ["x86_64"]

[tool.cibuildwheel.linux.environment]
CMAKE_GENERATOR = "Ninja"
PIP_ONLY_BINARY = "numpy,pyarrow,llvmlite,numba,scipy"
PIP_PREFER_BINARY = "1"

[tool.cibuildwheel.macos]
archs = ["arm64", "x86_64"]

[tool.cibuildwheel.macos.environment]
MACOSX_DEPLOYMENT_TARGET = "10.15"
CMAKE_GENERATOR = "Ninja"
PIP_ONLY_BINARY = "numpy,pyarrow,llvmlite,numba,scipy"
PIP_PREFER_BINARY = "1"

[tool.cibuildwheel.windows]
archs = ["AMD64"]

[tool.cibuildwheel.windows.environment]
CMAKE_GENERATOR = "Ninja"
PIP_ONLY_BINARY = "numpy,pyarrow,llvmlite,numba,scipy"
PIP_PREFER_BINARY = "1"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-q --import-mode=importlib"
testpaths = ["tests"]
timeout = 60
timeout_method = "thread"
filterwarnings = [
    "error::FutureWarning",
]

[tool.ruff]
line-length = 110
# Generated: regenerated from transport.proto and by setuptools-scm, never edited.
extend-exclude = ["src/disco/transports/proto/transport_pb2*", "src/disco/_version.py"]

[tool.ruff.format]
# ruff formats the Python blocks inside Markdown; the spec's snippets are contract-level
# illustrations edited through the sync-spec skill, not code to gate.
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
# tests/ is not listed: it has 176 errors today (fakes and SimpleNamespace passed where the
# real types are expected), and fixing them would need test changes or a looser config.
files = ["src/disco", ".claude/hooks"]
exclude = ['^src/disco/transports/proto/transport_pb2.*$', '^src/disco/_version\.py$']
plugins = ["pydantic.mypy"]
python_version = "3.14"
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
show_error_codes = true

disallow_untyped_defs = false
disallow_incomplete_defs = false

# disabling mypy untyped for now
[[tool.mypy.overrides]]
module = "disco.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
no_implicit_reexport = true

[project.scripts]
disco-server = "disco.cli.server:main"
disco = "disco.__main__:main"
